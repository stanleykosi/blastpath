name: BlastPath cloud live test

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "The deployed Vercel URL, including https://"
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLASTPATH_BASE_URL: ${{ inputs.app_url }}
      HYDRADB_HTTP_URL: ${{ secrets.HYDRADB_HTTP_URL }}
      HYDRADB_ADMIN_URL: ${{ secrets.HYDRADB_ADMIN_URL }}
      HYDRADB_NAMESPACE: default
      HYDRADB_GRAPH_ID: default
      HYDRADB_CELL_ID: cell-0
      HYDRADB_TOKEN: ${{ secrets.HYDRADB_TOKEN }}
      HYDRADB_TIMEOUT_MS: 15000
      BLASTPATH_FIXTURE_ROOT: ./fixtures
      ENABLE_SEED_ROUTE: "false"
      LOG_LEVEL: info
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run HydraDB smoke proof
        run: npm run smoke:hydradb

      - name: Verify fixture dry-run
        run: npm run seed:dry -- --fixtures ./fixtures

      - name: Seed the remote HydraDB graph
        run: npm run seed -- --fixtures ./fixtures

      - name: Check Vercel application health
        run: curl --fail --silent --show-error "$BLASTPATH_BASE_URL/api/health"

      - name: Run real HydraDB integration tests
        run: npm run test:integration

      - name: Run the remote Playwright journey
        run: npm run test:e2e

      - name: Verify seed idempotency
        run: |
          npm run seed -- --fixtures ./fixtures
          npm run test:integration

      - name: Verify the baseline after replay
        run: curl --fail --silent --show-error "$BLASTPATH_BASE_URL/api/incidents/GHSA-g7cv-rxg3-hmpx"
