services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:0.1.1
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:7687:7687"
    environment:
      CLOUD_PROVIDER: local
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      CELL_ID: cell-0
      NODE_ID: node-0
      STORE_PATH: /data/store
      CACHE_PATH: /data/cache
      BOLT_ADDR: 0.0.0.0:7687
      ADVERTISED_ADDR: hydradb:7687
      ENABLE_PLAINTEXT: "true"
      TOKEN_FILE: /run/secrets/hydradb_token
      RUST_MIN_STACK: "33554432"
    volumes:
      - ./hydradb-data:/data/store
      - ./hydradb-cache:/data/cache
      - ./hydradb-token:/run/secrets/hydradb_token:ro
